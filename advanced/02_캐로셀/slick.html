<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slick 캐로셀</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
</head>

<body>
    <div class="slider">
        <div><img src="assets/coffee1.jpg" alt="커피1"></div>
        <div><img src="assets/coffee2.jpg" alt="커피2"></div>
        <div><img src="assets/coffee3.jpg" alt="커피3"></div>
    </div>
    <script>
        $(".slider").slick({
            slidesToShow: 1,// 한 화면에 보이는 슬라이드 수
            slidesToScroll: 1,// 이동 시 넘기는 슬라이드 수
            autoplay: true,// 자동 재생
            autoplaySpeed: 4000,// 자동 재생 간격
            arrows: true,// 좌우 화살표
            dots: true,// 하단 점 네비게이션
            infinite: true,// 무한 루프
            speed: 600, // 애니메이션 속도
            responsive: [
                {
                    breakpoint: 1024,
                    settings: {
                        slidesToShow: 2
                    }
                },
                {
                    breakpoint: 768,
                    settings: {
                        slidesToShow: 1
                    }
                }
            ]
        });
    </script>
</body>

</html>
