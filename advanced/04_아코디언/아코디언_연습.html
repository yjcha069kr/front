<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연습</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap');
        /* 초기화 */
        * {
            box-sizing: border-box;
        }
        body,ul {
            margin: 0;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        a {
            text-decoration: none;
            color: #333;
        }
        body {
            font: 0.938rem/1.6 "Noto Sans KR", sans-serif;
            background: #fff;
        }
        /* 폰트어썸 */
        i {
            color: #3e3a39;
            font-size: 1.25rem;
        }
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            background: #ff5000;
        }
        /* 네이게이션 전체 */
        header .inner {
            position: absolute;
            width: 80%;
            right: 0%;
            background: rgb(69, 92, 107);
        }
        
        /* 1depth */
        .main>li {
            border-bottom: 1px solid #d9d9d9;
        }
        .main>li>a {
            position: relative;
            display: block;
            padding: 16px 24px;
            color: #fff;
            font-size: 1rem;
        }
        /* 메인메뉴 끝 +모양 */
        .main>li>a::before {
            content: '';
            position: absolute;
            top: 50%;
            right: 39px;
            width: 2px;
            height: 10px;
            background: #d9d9d9;
            transform: translateY(-50%);
        }
        .main>li>a::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 35px;
            width: 10px;
            height: 2px;
            background: #d9d9d9;
            transform: translateY(-50%);
        }

        /* 2depth */
        .sub li:not(:last-child) {
            border-bottom: 1px solid #d9d9d9;
        }
        .sub li a {
            font-size: 0.875rem;
            color: #333;
        }
        .sub-wrapper {
            display: grid;
            /* 초기상태 높이: 0 */
            grid-template-rows: 0fr;
            background: #f9f9f9;
        }
        .sub li:not(:last-child) {
            border-bottom: 1px solid #eee;
        }
        .sub li a {
            display: block;
            padding: 10px 30px;
            font-size: 0.875rem;
            color: #333;
        }
        .sub li a:hover {
            background: #eee;
        }

    </style>
</head>

<body>
    <header>
        <!-- Collapsed Menu Icon: 햄버거 메뉴 -->
        <div class="mwrap">
            <a class="menu-btn" href="#">
                <span></span>
                <span></span>
            </a>
        </div>

        <!-- GNB -->
        <div class="inner">
            <nav id="gnb">
                <!-- 1depth -->
                <ul class="main">
                    <li><a href="#">렌터카 예약</a></li>
                    <li><a href="#">차량소개</a>
                        <!-- 2depth -->
                        <div class="sub-wrapper">
                            <ul class="sub">
                                <li><a href="#">경형·소형</a></li>
                                <li><a href="#">중형</a></li>
                                <li><a href="#">승합</a></li>
                                <li><a href="#">SUV/RV</a></li>
                                <li><a href="#">전기</a></li>
                            </ul>
                        </div>
                    </li>
                    <li><a href="#">이벤트</a></li>
                    <li><a href="#">이용안내</a>
                        <div class="sub-wrapper">
                            <ul class="sub">
                                <li><a href="#">렌터카 이용 안내</a></li>
                                <li><a href="#">보험 안내</a></li>
                                <li><a href="#">기타 유의사항</a></li>
                            </ul>
                        </div>
                    </li>
                    <li><a href="#">고객센터</a>
                        <div class="sub-wrapper">
                            <ul class="sub">
                                <li><a href="#">공지사항</a></li>
                                <li><a href="#">자주 묻는 질문</a></li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </nav>
            <!-- sns -->
            <div class="util">
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-app-store-ios"></i></a>
                <a href="#"><i class="fa-brands fa-google-play"></i></a>
                <a href="#"><i class="fa-regular fa-folder-open"></i></a>
            </div>
            <div class="login">
                <a href="#"><i class="fa-solid fa-user"></i></a>
                <a href="#"><i class="fa-solid fa-user-plus"></i></a>
            </div>
        </div>
    </header>
</body>

</html>
