<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가로 스크롤 페이지</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* 전체 페이지 스크롤 방지 */
        }

        #scroll-container {
            width: 100vw;
            height: 100vh;
            overflow-x: auto;
            /* 가로 스크롤바 표시 */
            overflow-y: hidden;
            white-space: nowrap;
            /* 자식 요소 줄바꿈 방지 */
        }

        .horizontal-wrap {
            display: inline-flex;
            /* 인라인 블록처럼 동작하여 가로 배치 */
            width: max-content;
            /* 내용물 크기만큼 너비 확보 key point */
            height: 100%;
        }

        .page {
            width: 100vw;
            height: 100vh;
            display: inline-flex;
            /* display: flex 유지 */
            justify-content: center;
            align-items: center;
            font-size: 50px;
            color: #fff;
            font-weight: bold;
            vertical-align: top;
            /* 인라인 요소 간 정렬 */
        }

        .page1 {
            background: #ff6b6b;
        }

        .page2 {
            background: #4d96ff;
        }

        .page3 {
            background: #6bcf63;
        }

        .page4 {
            background: #ffc93c;
        }

        .page5 {
            background: #19ffc6;
        }
    </style>
</head>

<body>
    <!-- 별도의 스크롤 컨테이너 사용 -->
    <main id="scroll-container">
        <div class="horizontal-wrap">
            <section class="page page1">Page 1</section>
            <section class="page page2">Page 2</section>
            <section class="page page3">Page 3</section>
            <section class="page page4">Page 4</section>
        </div>
    </main>

    <script>
        const container = document.getElementById('scroll-container'); // 스크롤 컨테이너 엘리먼트 참조
        let target = container.scrollLeft; // 이동 목표 위치 (계속 누적됨)
        let current = target; // 현재 실제 스크롤 위치 (목표를 뒤쫓아감)
        let isMoving = false; // 애니메이션 실행 중인지 여부

        // 휠 이벤트 등록 (passive: false는 preventDefault()를 위해 필수)
        container.addEventListener("wheel", e => {
            e.preventDefault(); // 기본 수직 스크롤 방지

            // 애니메이션이 멈춘 상태에서 휠을 굴리면, 현재 위치에서 다시 시작하도록 동기화
            // (사용자가 스크롤바를 드래그해서 위치가 바뀌었을 경우 대비)
            if (!isMoving) target = current = container.scrollLeft;

            // 목표 위치(target) 계산: 현재 target에 휠 이동량(deltaY)을 더함
            // Math.max/min을 사용하여 스크롤 가능 범위를 벗어나지 않도록 제한(Clamp)
            // 0 ~ (전체너비 - 화면너비) 사이의 값으로 고정
            target = Math.max(0, Math.min(container.scrollWidth - container.clientWidth, target + e.deltaY));

            // 애니메이션이 실행 중이 아니라면 루프 시작
            if (!isMoving) {
                isMoving = true;
                animate();
            }
        }, { passive: false });

        // 부드러운 이동을 처리하는 애니메이션 함수
        function animate() {
            // 선형 보간(Lerp): 남은 거리의 5%(0.05)만큼만 이동하여 부드러운 감속 효과 생성
            current += (target - current) * 0.05;

            // 실제 컨테이너의 스크롤 위치 업데이트
            container.scrollLeft = current;

            // 목표와 현재 위치의 차이가 0.5px 미만이면 거의 도달한 것으로 간주하고 정지
            if (Math.abs(target - current) < 0.5) {
                isMoving = false; // 애니메이션 상태 해제
            } else {
                // 아직 도달하지 못했으면 다음 프레임 요청 (재귀 호출)
                requestAnimationFrame(animate);
            }
        }
    </script>

</body>

</html>
